name: CodeQL Python Offline RBAC Gate
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
