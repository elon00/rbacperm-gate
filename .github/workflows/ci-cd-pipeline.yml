name: Offline RBAC Policy Gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile and 17 adversarial regressions
        run: |
          python -m compileall -q rbac_gate.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Legacy smoke entrypoint
        run: python tests/reality_check_harness.py
      - name: Rust formatting and compilation
        run: |
          cargo fmt --all -- --check
          cargo test --locked
